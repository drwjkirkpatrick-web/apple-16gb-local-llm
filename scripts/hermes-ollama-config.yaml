# Hermes Agent config snippet for Ollama backend — 64K context
#
# Copy these values into ~/.hermes/config.yaml under the model: section,
# or use: hermes config edit
#
# Points Hermes at a local Ollama instance running Qwen3 8B at 65,536 tokens of
# context. Two things must both be true for that to fit in 16 GB:
#   1. the model variant sets num_ctx 65536     (setup-ollama.sh creates it)
#   2. the Ollama server runs with an 8-bit KV cache:
#          OLLAMA_FLASH_ATTENTION=1
#          OLLAMA_KV_CACHE_TYPE=q8_0
#      KV cache type is a server setting in Ollama, not a modelfile parameter.

model:
  # "custom" = any OpenAI-compatible endpoint (Ollama, vLLM, llama.cpp, ...)
  provider: custom

  # Ollama's OpenAI-compatible API
  base_url: "http://127.0.0.1:11434/v1"

  # Ollama needs no API key
  api_key: ""

  # The variant created by: ollama create qwen3-8b-64k
  default: "qwen3-8b-64k"

  # MUST be >= 64000. Hermes rejects smaller context windows outright
  # (MINIMUM_CONTEXT_LENGTH = 64000 in agent/model_metadata.py).
  context_length: 65536

# Compression: on a 16 GB Mac, compress earlier than the default so the KV cache
# never actually fills to 64K. 0.45 triggers at ~29K tokens.
compression:
  enabled: true
  threshold: 0.45
  target_ratio: 0.20

# Optional: fully offline auxiliary models. Adds load on a 16 GB machine —
# leave as "auto" unless you need zero network access.
#
# auxiliary:
#   compression:
#     provider: custom
#     base_url: "http://127.0.0.1:11434/v1"
#     model: "qwen3-8b-64k"
#     timeout: 180
#   title_generation:
#     provider: custom
#     base_url: "http://127.0.0.1:11434/v1"
#     model: "qwen3-8b-64k"
#     timeout: 30
