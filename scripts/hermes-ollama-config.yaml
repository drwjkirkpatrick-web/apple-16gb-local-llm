# Hermes Agent config snippet for Ollama backend
# 
# Copy these values into your ~/.hermes/config.yaml under the model: section
# Or use: hermes config edit
#
# This config points Hermes at a local Ollama instance running Qwen3 8B
# with 32K context — the recommended setup for a 16 GB Apple Silicon Mac.

model:
  # Use "custom" for any OpenAI-compatible endpoint (Ollama, vLLM, llama.cpp, etc.)
  provider: custom
  
  # Ollama's OpenAI-compatible API endpoint
  base_url: "http://localhost:11434/v1"
  
  # Ollama doesn't require an API key
  api_key: ""
  
  # The model name we created with: ollama create qwen3-8b-32k
  default: "qwen3-8b-32k"
  
  # Match the context length we set in the Ollama modelfile (32768)
  # This tells Hermes to start compressing context at ~16K tokens (50% threshold)
  context_length: 32768

# Optional: auxiliary model configuration
# These tasks (compression, title generation) can use the same local model
# to avoid any API calls. On a 16 GB Mac this adds load, so you may prefer
# to leave these as "auto" (uses your main model) or comment them out.
#
# auxiliary:
#   compression:
#     provider: custom
#     base_url: "http://localhost:11434/v1"
#     model: "qwen3-8b-32k"
#     timeout: 120
#   title_generation:
#     provider: custom
#     base_url: "http://localhost:11434/v1"
#     model: "qwen3-8b-32k"
#     timeout: 30